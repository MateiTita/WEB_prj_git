<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form id="form">
        <h1>Sign Up/Sign In</h1>
        <h1>Conecteaza te fratello</h1>
        <label for="name">Name</label>
        <input type="text" id="name" name="name">
        <span id="name-error" class="error"></span>

        <label for="email">Email</label>
        <input type="email" id="email" name="email">

        <label for="date">Date</label>
        <input type="date" id="date" name="date">

        <p>Gender</p>
        <label><input type="radio" name="gender" value="male"> Male</label>
        <label><input type="radio" name="gender" value="female"> Female</label>

        <p>Hobbies</p>
        <label><input type="checkbox" name="hobbies" value="sports"> Sports</label>
        <label><input type="checkbox" name="hobbies" value="music"> Music</label>
        <label><input type="checkbox" name="hobbies" value="reading"> Reading</label>

        <label for="country">Country</label>
        <select id="country" name="country">
            <option>Romania</option>
            <option>Germany</option>
            <option>France</option>
        </select>

        <label for="message">Message</label>
        <textarea id="message" name="message"></textarea>

        <button type="submit">Submit</button>
    </form>

    <script>
        // Numele trebuie scris doar cu litere mari (sunt permise spatii si cratime intre cuvinte)
        function valideazaNume(nume) {
            nume = nume.trim();
            if (nume === "") {
                return "Numele este obligatoriu.";
            }
            if (!/^[A-ZĂÂÎȘȚ]+([ -][A-ZĂÂÎȘȚ]+)*$/.test(nume)) {
                return "Numele trebuie introdus doar cu litere mari (ex: POPESCU ION).";
            }
            return "";
        }

        const form = document.getElementById("form");
        const numeInput = document.getElementById("name");
        const numeEroare = document.getElementById("name-error");

        function afiseazaEroareNume() {
            const eroare = valideazaNume(numeInput.value);
            numeEroare.textContent = eroare;
            return eroare === "";
        }

        numeInput.addEventListener("input", afiseazaEroareNume);

        form.addEventListener("submit", function (e) {
            if (!afiseazaEroareNume()) {
                e.preventDefault();
                numeInput.focus();
            }
        });
    </script>
</body>
</html>
